name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # Cho phép bấm chạy thủ công trên giao diện GitHub

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, bcmath, intl, pdo_mysql
          tools: composer:v2

      - name: Cài thư viện PHP (bản Production, không có module dev)
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build giao diện Vue/Vite
        run: |
          npm ci
          npm run build

      - name: Nén mã nguồn thành 1 file deploy.zip
        # Nén toàn bộ thư mục, loại trừ các file rác, file môi trường và các thư mục không cần thiết trên server
        run: zip -rq deploy.zip . -x "**/.git/**" "**/.github/**" "**/node_modules/**" "tests/**" ".env*" "public/hot"

      - name: Upload file Zip lên host cPanel qua FTPS
        # Bắn trực tiếp 1 file zip lên server giúp giải quyết triệt để lỗi timeout
        run: curl -T deploy.zip --ftp-ssl --insecure -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" ftp://${{ secrets.FTP_SERVER }}/

      - name: Gọi API kích hoạt giải nén và Migrate trên host
        env:
          DT: ${{ secrets.DEPLOY_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        if: ${{ env.DT != '' && env.APP_URL != '' }}
        run: |
          sleep 5
          # Gọi webhook để yêu cầu host tự giải nén và chạy cấu hình
          curl -fsS --retry 3 --retry-delay 5 -X POST "${APP_URL%/}/api/he-thong/cap-nhat" \
            -H "X-Deploy-Token: $DT" -H "Accept: application/json"